[versions]
agp = "9.5.2"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# Lifecycle (ViewModels…) : 2.11.1, dernière version stable (18/11/2026), qui
# contient aussi le module ViewModel de Navigation 3 (décision 59).
lifecycleRuntimeKtx = "2.11.1"
# Navigation 3 : passage d'un écran à l'autre (décision 59).
nav3 = "1.2.2"
activityCompose = "1.13.0"
# Kotlin : 2.4.21 (au lieu de 2.2.10, version par défaut du plugin Android), car
# supabase-kt 3.9.0 est construite en Kotlin 2.4 (décision 55). À garder
# IDENTIQUE à la version du « classpath » dans le build.gradle.kts principal.
kotlin = "2.4.21"
composeBom = "2026.02.01"
# Bibliothèque Kotlin de Supabase (connexion, lecture de la base, fonctions serveur).
supabase = "3.9.0"
# Ktor : la bibliothèque réseau sur laquelle repose supabase-kt. Même version
# que celle utilisée par supabase-kt 3.9.0 (3.6.0 selon une source secondaire).
ktor = "3.6.0"
# Coil : chargement des affiches depuis Internet, avec cache (décision 62).
coil = "3.6.3"
# DataStore : petite mémoire sur le téléphone (filtre de « Ma liste », plus
# tard thème et annonces) ; 1.3.0, dernière version stable (21/10/2026)
# d'après la page des versions d'Android (décision 88).
datastore = "1.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# ViewModels dans Compose, lecture de leur état, et un ViewModel par écran
# avec Navigation 3.
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleRuntimeKtx" }
# Navigation 3.
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "nav3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "nav3" }
# supabase-kt : la « BOM » fixe une version commune à tous ses modules.
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-functions = { group = "io.github.jan-tennert.supabase", name = "functions-kt" }
# Moteur réseau de Ktor pour Android (celui du guide officiel de Supabase).
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
# Coil 3 : affichage d'images dans Compose, et téléchargement par OkHttp.
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
# DataStore « Preferences » : des paires clé-valeur, comme le stockage local du site.
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Sérialisation : transforme les données de la base (JSON) en objets Kotlin, et
# permet d'enregistrer l'historique des écrans de Navigation 3.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

